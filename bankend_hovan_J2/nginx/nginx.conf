# ============================================================
#  VietLamH24 — Nginx Rate Limiting Config
#  Nginx >= 1.15.7 (khuyến nghị: 1.24+)
#
#  User → Nginx (:80) → Spring Boot (:8080)
#
#  Rate Limit Zones:
#   • ip_limit      — 30 req/s/IP  (chống spam/DDoS)
#   • user_limit    — 20 req/s/user  (JWT user_id header)
#   • search_limit  — 5  req/s/search  (chống search spam)
#   • upload_limit  — 1  req/s  (limit upload bandwidth)
# ============================================================

# ── Worker processes — đặt bằng số CPU cores ──
worker_processes auto;

# ── Log khi debug ──
# worker_rlimit_nofile 65535;
# error_log  logs/error.log  warn;
# pid        logs/nginx.pid;

events {
    worker_connections  4096;
    use               epoll;        # Linux optimized
    multi_accept      on;
}

http {
    # ── MIME types ──
    include       mime.types;
    default_type  application/octet-stream;

    # ── Logging ──
    log_format  main  '$remote_addr [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  logs/access.log  main;

    # ── Buffer sizes ──
    client_body_buffer_size    16k;
    client_header_buffer_size  1k;
    client_max_body_size      10m;    # Max upload: 10MB
    large_client_header_buffers 4 8k;

    # ── Timeout settings ──
    client_body_timeout    12;
    client_header_timeout  12;
    keepalive_timeout     65;
    send_timeout          12;
    sendfile              on;
    tcp_nopush           on;
    tcp_nodelay          on;

    # ── Gzip compression ──
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    4;
    gzip_min_length    1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ================================================================
    #  RATE LIMIT ZONES
    # ================================================================

    # Zone 1: Theo IP — giới hạn theo địa chỉ IP client
    # Lưu trữ: 10MB → khoảng 160,000 entries (IP)
    # Tốc độ: 30 requests/giây/IP
    limit_req_zone $binary_remote_addr
        zone=ip_limit:10m rate=30r/s;

    # Zone 2: Theo JWT user_id — giới hạn theo user đã đăng nhập
    # Lưu trữ: 50MB → khoảng 800,000 entries
    # Tốc độ: 20 requests/giây/user
    # Giá trị $http_x_user_id được set bởi backend (X-User-Id response header)
    # hoặc có thể extract từ JWT cookie ở đây
    limit_req_zone $cookie_vietlamh24_user
        zone=user_limit:50m rate=20r/s;

    # Zone 3: Search — giới hạn đặc biệt cho search endpoint
    # Tốc độ: 5 requests/giây/user (hoặc IP nếu chưa đăng nhập)
    limit_req_zone $binary_remote_addr
        zone=search_limit:10m rate=5r/s;

    # Zone 4: Upload — giới hạn cực chặt cho upload
    # Tốc độ: 1 request/giây/IP
    limit_req_zone $binary_remote_addr
        zone=upload_limit:10m rate=1r/s;

    # ================================================================
    #  UPSTREAM — Backend Servers
    # ================================================================

    upstream backend_servers {
        # least_conn — ưu tiên server có ít kết nối hơn
        # → Công bằng hơn round-robin khi có server bị nặng
        least_conn;

        # Server 1 — instance chính (localhost:8080)
        server 127.0.0.1:8080 weight=5 max_fails=3 fail_timeout=30s;

        # Server 2 — thêm instance nếu cần scale
        # Uncomment dòng dưới và bật instance 2 trên port 8081
        # server 127.0.0.1:8081 weight=3 max_fails=3 fail_timeout=30s;

        # Giữ 32 connections alive đến upstream
        keepalive 32;
    }

    # ================================================================
    #  SERVER BLOCK
    # ================================================================

    server {
        listen       80;
        server_name  localhost;
        # server_name  api.vietlamh24.com;  # Bật khi deploy production

        # ── Chặn đường lên filesystem ──
        location / {
            root   html;
            index  index.html index.htm;
        }

        # ============================================================
        #  /api/ — Tất cả API requests
        # ============================================================
        location /api/ {
            # Gắn upstream backend
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";

            # Headers cho backend biết client thật
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Host              $host;

            # Timeout — bảo vệ backend
            proxy_connect_timeout  5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            # Buffering — giảm pressure lên backend
            proxy_buffering    on;
            proxy_buffer_size 8k;
            proxy_buffers     8 16k;
            proxy_busy_buffers_size 24k;

            # ── Rate limit: IP zone, burst 50 ──
            # burst=50: cho phép tạm thời vượt rate 50 requests
            # nodelay: không delay burst requests (vẫn tính vào limit)
            limit_req zone=ip_limit burst=50 nodelay;
            limit_req_status 429;

            # ── Thêm headers rate limit info ──
            add_header X-RateLimit-Zone   $limit_req_status always;
        }

        # ============================================================
        #  /api/auth/ — Auth endpoints (CHẶT NHẤT)
        # ============================================================
        location /api/auth/ {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Host              $host;
            proxy_connect_timeout  5s;
            proxy_send_timeout    10s;   # Auth nhanh — timeout ngắn
            proxy_read_timeout    10s;

            # burst=10: chỉ cho 10 requests vượt rate tạm thời
            # → Chống brute force login
            limit_req zone=ip_limit burst=10 nodelay;
            limit_req_status 429;

            # Cache KHÔNG cho auth — luôn gọi backend mới
            proxy_cache_bypass 1;
            expires            -1;
        }

        # ============================================================
        #  /api/jobs/search — Search endpoint
        # ============================================================
        location /api/jobs/search {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Host              $host;
            proxy_connect_timeout  5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            # ── Rate limit: search zone, burst 10 ──
            limit_req zone=search_limit burst=10 nodelay;
            limit_req_status 429;

            # ── Cache kết quả 5 phút ──
            # → Giảm load backend cho search giống nhau
            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status always;

            # Proxy cache key
            proxy_cache_key "$scheme$request_method$host$request_uri$http_x_user_id";
            proxy_cache_valid any 5m;
        }

        # ============================================================
        #  /api/companies/search — Search endpoint
        # ============================================================
        location /api/companies/search {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Host              $host;
            proxy_connect_timeout  5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    60s;

            limit_req zone=search_limit burst=10 nodelay;
            limit_req_status 429;

            proxy_cache_valid 200 5m;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # ============================================================
        #  /api/upload/ — Upload endpoint (CỰC CHẶT)
        # ============================================================
        location /api/upload/ {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Host              $host;

            # Upload cần timeout dài hơn
            proxy_connect_timeout  10s;
            proxy_send_timeout    120s;   # Upload file có thể mất thời gian
            proxy_read_timeout    120s;

            # Kích thước body tối đa: 10MB
            client_max_body_size  10m;

            # burst=3: chỉ cho 3 requests vượt rate
            limit_req zone=upload_limit burst=3 nodelay;
            limit_req_status 429;

            # Tắt cache cho upload
            proxy_cache_bypass 1;
            expires -1;
        }

        # ============================================================
        #  /actuator/ — Health check (KHÔNG limit)
        # ============================================================
        location /actuator/ {
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Host              $host;
            proxy_connect_timeout  2s;
            proxy_send_timeout    5s;
            proxy_read_timeout    5s;

            # KHÔNG áp rate limit cho health check
            # → Dùng cho load balancer health probes
        }

        # ============================================================
        #  Static assets — Cache dài hạn
        # ============================================================
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
            # Proxy đến backend (hoặc CDN nếu có)
            proxy_pass         http://backend_servers;
            proxy_http_version 1.1;

            # Cache 1 năm — file tĩnh không đổi
            expires           1y;
            add_header        Cache-Control "public, immutable";
            add_header        X-Asset "static" always;

            # Nén trước khi cache
            gzip_static       on;
        }

        # ============================================================
        #  ERROR PAGES
        # ============================================================

        # 429 Too Many Requests — khi rate limit vượt quá
        error_page 429 = @rate_limit_exceeded;

        location @rate_limit_exceeded {
            default_type application/json;
            charset utf-8;
            return 429 '{
                "error": "Quá nhiều yêu cầu. Vui lòng chờ và thử lại.",
                "code": "RATE_LIMIT_EXCEEDED",
                "retryAfter": 60,
                "message": "Bạn đã gửi quá nhiều requests. Rate limit: 30 req/s. Vui lòng giảm tần suất và thử lại sau."
            }';
        }

        # 502 Bad Gateway — backend không phản hồi
        error_page 502 503 504 = @backend_down;
        location @backend_down {
            default_type application/json;
            return 502 '{"error": "Backend không phản hồi","code":"BACKEND_UNAVAILABLE"}';
        }

        # 504 Gateway Timeout
        error_page 504 = @gateway_timeout;
        location @gateway_timeout {
            default_type application/json;
            return 504 '{"error": "Yêu cầu mất quá lâu","code":"GATEWAY_TIMEOUT"}';
        }
    }
}
