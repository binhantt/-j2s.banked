server:
  port: 8080
  tomcat:
    threads:
      max: 500
      min-spare: 50
    max-connections: 10000
    accept-count: 500
    connection-timeout: 20000
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
      file-size-threshold: 2KB

  datasource:
    url: jdbc:mysql://localhost:3306/hovan?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&cachePrepStmts=true&useServerPrepStmts=true&rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 100
      minimum-idle: 20
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 5
          max-wait: 1000

google:
  client-id: ${GOOGLE_CLIENT_ID:273697303002-9pbu7fmp2og73cvfoqes1buh1779eftu.apps.googleusercontent.com}

github:
  client-id: ${GITHUB_CLIENT_ID:Ov23lilqZFdq7a0Euerg}
  client-secret: ${GITHUB_CLIENT_SECRET:}

facebook:
  app-id: ${FACEBOOK_APP_ID:}
  app-secret: ${FACEBOOK_APP_SECRET:}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 604800000

security:
  aes:
    key: ${AES_KEY:}

imgbb:
  api:
    key: ${IMGBB_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    com.example.bankend_hovan_J2: INFO
    com.example.bankend_hovan_J2.infrastructure.oauth.GoogleTokenVerifier: DEBUG
    com.example.bankend_hovan_J2.application.auth.GoogleLoginUseCase: DEBUG
    com.example.bankend_hovan_J2.presentation.auth.AuthController: DEBUG
    org.hibernate.SQL: WARN
    org.springframework.web: INFO

springdoc:
  api-docs:
    path: /api/swagger.json
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
  show-actuator: false
  supported-submit-methods:
    - get
    - post
    - put
    - patch
    - delete

rate-limit:
  enabled: true
  whitelist-paths: |
    /api/notifications/,
    /api/upload/,
    /api/cv/,
    /uploads/,
    /api/health,
    /api/swagger.json,
    /swagger-ui,
    /swagger-ui/,
    /swagger-ui.html,
    /v3/api-docs

  group:
    google-login:              # /api/auth/google — 10 req/s → block IP 60s
      limit: 10
      window-seconds: 60

    auth-strict:               # /api/auth/login, /api/auth/register — chống brute-force
      limit: 5
      window-seconds: 60

    auth:                      # /api/auth/** (khác)
      limit: 10
      window-seconds: 60

    read:                      # GET /api/jobs, /api/companies, /api/blog, /api/domains
      limit: 200
      window-seconds: 60

    write:                     # POST/PUT/PATCH/DELETE non-auth
      limit: 20
      window-seconds: 60

    default:                    # Fallback
      limit: 100
      window-seconds: 60

anti-debug:
  guard:
    violation-threshold: ${ANTI_DEBUG_VIOLATION_THRESHOLD:3}
    violation-window-seconds: ${ANTI_DEBUG_VIOLATION_WINDOW_SECONDS:300}
    lock-duration-seconds: ${ANTI_DEBUG_LOCK_DURATION_SECONDS:900}
    max-audit-events: ${ANTI_DEBUG_MAX_AUDIT_EVENTS:500}
